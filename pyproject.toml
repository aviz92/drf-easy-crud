[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drf-easy-crud"
version = "3.0.0"
description = "Easy CRUD operations for Django REST Framework."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Avi Zaguri" },]
keywords = ["development", "python", "django"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Framework :: Django",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "custom-python-logger>=4.2.0",
    "django>=5.2.11",
    "djangorestframework>=3.18.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-better-report>=1.0.3",
    "pytest-django>=4.14.0",
    "python-base-toolkit>=1.2.1",
]

[project.urls]
Homepage = "https://github.com/aviz92/drf-easy-crud"
Repository = "https://github.com/aviz92/drf-easy-crud"
Issues = "https://github.com/aviz92/drf-easy-crud/issues"

[tool.setuptools.packages.find]
where = ["."]
# include = ["drf_easy_crud*"]
namespaces = false
